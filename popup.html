<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Discord → NotebookLM</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" role="img"><path d="M7 7.5h18a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H15l-6.5 4v-4H7a3 3 0 0 1-3-3v-10a3 3 0 0 1 3-3Z" /><path class="mark-line" d="M10 13h12M10 18h8" /></svg>
        </div>
        <div>
          <h1>Discord → NotebookLM</h1>
          <p>チャンネル履歴を、読みやすい資料へ。</p>
        </div>
      </header>

      <section class="panel" aria-labelledby="tokenHeading">
        <div class="section-heading">
          <span class="step">🔑</span>
          <div>
            <h2 id="tokenHeading">Discordトークン</h2>
            <p>ペーストでAPI取得。無入力時はDOMスクレイピング。</p>
          </div>
        </div>
        <div class="token-row">
          <input id="tokenInput" type="password" placeholder="Discordユーザートークンをペースト..." autocomplete="off" />
          <button id="tokenLoadButton" class="primary-button small" type="button">読込</button>
          <button id="tokenClearButton" class="text-button small" type="button">クリア</button>
        </div>
        <div id="tokenStatus" class="token-status hidden"></div>
      </section>

      <section id="statusCard" class="status-card" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <div>
          <strong id="statusTitle">準備中</strong>
          <span id="statusDetail">トークンを入力するかDiscordタブを開いてください。</span>
        </div>
      </section>

      <section class="panel" aria-labelledby="targetHeading">
        <div class="section-heading">
          <span class="step">1</span>
          <div>
            <h2 id="targetHeading">取り込む場所</h2>
            <p id="sourceHint">API または DOM から検出します。</p>
          </div>
        </div>

        <label for="serverSelect">サーバー</label>
        <select id="serverSelect" disabled>
          <option>まずサーバーを読み込んでください</option>
        </select>

        <label for="channelSelect">チャンネル</label>
        <div class="select-row">
          <select id="channelSelect" disabled>
            <option>チャンネルを選択</option>
          </select>
          <button id="openChannelButton" class="icon-button" type="button" title="Discordで開く" disabled>↗</button>
        </div>
        <button id="refreshButton" class="text-button" type="button">再読込</button>
      </section>

      <section class="panel" aria-labelledby="rangeHeading">
        <div class="section-heading compact">
          <span class="step">2</span>
          <div>
            <h2 id="rangeHeading">範囲</h2>
            <p>API使用時は高速・高精度に取得できます。</p>
          </div>
        </div>
        <div class="field-grid">
          <div>
            <label for="sinceDate">この日以降</label>
            <input id="sinceDate" type="date" />
          </div>
          <div>
            <label for="maxMessages">最大件数</label>
            <input id="maxMessages" type="number" min="10" max="10000" step="10" value="1000" />
          </div>
        </div>
      </section>

      <section class="actions" aria-labelledby="actionHeading">
        <div class="section-heading compact no-padding">
          <span class="step">3</span>
          <div>
            <h2 id="actionHeading">書き出し</h2>
            <p>NotebookLM向けMarkdownに整形します。</p>
          </div>
        </div>
        <button id="importButton" class="primary-button" type="button" disabled>NotebookLMへ送る</button>
        <button id="downloadButton" class="secondary-button" type="button" disabled>Markdownを保存</button>
        <div id="progress" class="progress hidden" aria-live="polite">
          <div class="progress-track"><span id="progressBar"></span></div>
          <p id="progressText">準備中…</p>
        </div>
      </section>

      <footer>
        <span class="shield" aria-hidden="true">✓</span>
        <p>トークンは端末内のみで使用され外部送信されません。</p>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
